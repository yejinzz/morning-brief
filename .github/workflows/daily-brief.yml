name: Daily Brief

# KST 07:07 목표(UTC 22:07). 정각 회피로 GitHub 고부하 지연 완화.
# ⚠ 무료 cron 은 정확한 07:00 을 보장하지 않음(지연·누락 가능, docs/07 §2).
on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '대상 날짜(YYYY-MM-DD, 생략 시 오늘 KST)'
        required: false

# 표준 러너만 — public 저장소 무료(larger runner 과금 방지)
jobs:
  brief:
    name: generate daily briefing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/news-pipeline
    env:
      # mock: 실 RSS + Mock AI + Mock 푸시(키·비용 없이 흐름 검증).
      # live(M5): Gemini + Supabase + 실 Web Push. 아래 Secret 사용.
      MB_MODE: ${{ vars.MB_MODE || 'mock' }}
      INPUT_DATE: ${{ github.event.inputs.date }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -e ".[push]"
      - name: run daily briefing
        run: python -m mb_pipeline.run_daily_cli
