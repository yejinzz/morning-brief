name: Deploy Pages

# PWA(정적) → GitHub Pages. 서브경로 /morning-brief/ 로 빌드.
# 선행: 레포 Settings → Pages → Source 를 "GitHub Actions" 로 설정.
# 배포는 main(릴리스 브랜치)에서만. github-pages 환경이 기본 브랜치만 허용하기 때문.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개(진행 중이면 최신으로 교체)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: build (subpath + public env)
        env:
          VITE_BASE: /morning-brief/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: pnpm run build
      - name: SPA fallback (404 → index)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
