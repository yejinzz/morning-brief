[project]
name = "mb-pipeline"
version = "0.0.0"
description = "Morning Brief 뉴스 수집·분석·선정·푸시 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "feedparser>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-jsonschema>=4.22",
]
# 실 Web Push 발송(운영 환경). CI/테스트는 MockPushSender 라 불필요.
push = [
    "pywebpush>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["mb_pipeline"]
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["feedparser", "pywebpush"]
ignore_missing_imports = true
